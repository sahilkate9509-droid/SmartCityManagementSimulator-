services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: smartcity
      POSTGRES_USER: smartcity
      POSTGRES_PASSWORD: smartcity
    ports:
      - "5432:5432"
    volumes:
      - smartcity_pg:/var/lib/postgresql/data
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./Backend:/app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql://smartcity:smartcity@db:5432/smartcity
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  smartcity_pg:
